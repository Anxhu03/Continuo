<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continuo — Context Continuity Companion</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="popup-shell">
    <!-- Clean Minimal Header -->
    <div class="popup-header">
      <div class="brand-group">
        <div class="brand-ring">
          <span class="brand-dot"></span>
        </div>
        <div class="brand-text">
          <span class="brand-title">CONTINUO</span>
        </div>
      </div>
      <div class="connection-status">
        <span class="status-indicator" id="status-indicator"></span>
        <span class="status-label" id="status-label">Ready</span>
      </div>
    </div>

    <!-- Active AI Detection Status -->
    <div class="detection-box" id="detection-box">
      <div class="detection-status-row">
        <span class="pulse-dot" id="pulse-dot"></span>
        <span class="detection-status-text" id="detection-status-text">Conversation detected</span>
      </div>
      <div class="detection-source" id="detection-source">ChatGPT (Active Tab)</div>
    </div>

    <!-- Project Selection -->
    <div class="project-box">
      <label for="ext-project-select" class="project-label">Project:</label>
      <select id="ext-project-select" class="project-select">
        <option value="" disabled selected>Loading projects...</option>
      </select>
    </div>

    <!-- Context Readiness -->
    <div class="context-ready-indicator" id="context-ready-indicator">
      <span class="ready-badge">Context ready</span>
    </div>

    <!-- Main Save Action Button -->
    <button class="save-context-btn" id="btn-ext-capture" type="button">
      <span id="btn-ext-capture-text">Save Context</span>
    </button>

    <!-- Post-Save Success & Continuation Panel -->
    <div class="handoff-panel" id="handoff-panel" style="display: none;">
      <div class="success-banner">
        <span class="check-mark">✓</span>
        <span class="success-text">Context saved</span>
      </div>

      <div class="continue-actions">
        <button class="continue-btn chatgpt" id="btn-cont-chatgpt" type="button">
          <span>Continue with ChatGPT</span>
          <span class="arrow">→</span>
        </button>
        <button class="continue-btn claude" id="btn-cont-claude" type="button">
          <span>Continue with Claude</span>
          <span class="arrow">→</span>
        </button>
        <button class="continue-btn gemini" id="btn-cont-gemini" type="button">
          <span>Continue with Gemini</span>
          <span class="arrow">→</span>
        </button>
      </div>

      <button class="view-memory-btn" id="btn-view-memory" type="button">
        <span>View Project Memory</span>
        <span class="ext-link">↗</span>
      </button>
    </div>

    <!-- Advanced Diagnostics (Subtle Collapsible Drawer) -->
    <details class="advanced-drawer" id="advanced-drawer">
      <summary class="advanced-summary">Advanced Diagnostics</summary>
      <div class="advanced-body">
        <div class="adv-row">
          <span>Extraction Fidelity:</span>
          <strong id="adv-fidelity">--%</strong>
        </div>
        <div class="adv-row">
          <span>Active Version:</span>
          <strong id="adv-version">--</strong>
        </div>
        <div class="adv-row">
          <span>API Gateway:</span>
          <strong id="adv-gateway">127.0.0.1:8008</strong>
        </div>
        <div class="adv-log" id="adv-log">Ready for user-triggered capture.</div>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
